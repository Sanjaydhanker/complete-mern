<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Hello world</h1>
    <button>Stop</button>
  </body>
  <script>
    const myFn = function () {
      console.log("Hello Sajnay");
      document.querySelector("h1").innerHTML = "Hello Sanjay";
    };
    const stopMe = setTimeout(myFn, 2000);

    document.querySelector("button").addEventListener("click", () => {
      clearTimeout(stopMe);
    });
  </script>
</html>
